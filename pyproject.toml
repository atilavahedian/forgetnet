[project]
name = "forgetnet"
version = "0.1.0"
description = "Plastic-memory sequence models that learn what to remember and forget."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Atila Vahedian" }]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "torch>=2.3",
    "tqdm>=4.66",
]

[project.scripts]
forgetnet = "forgetnet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgetnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
